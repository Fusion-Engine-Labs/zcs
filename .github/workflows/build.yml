name: Zig

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read
    actions: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    fmt:
        runs-on: blacksmith-4vcpu-ubuntu-2404

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Zig
              uses: mlugg/setup-zig@v2
              with:
                  version: 0.17.0
                  cache-key: fmt

            - name: Check formatting
              run: zig fmt --check .

    test:
        runs-on: blacksmith-4vcpu-ubuntu-2404
        strategy:
            fail-fast: false
            matrix:
                optimize: [Debug, ReleaseSafe, ReleaseFast, ReleaseSmall]

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Zig
              uses: mlugg/setup-zig@v2
              with:
                  version: 0.17.0
                  cache-key: test-${{ matrix.optimize }}

            - name: Compile everything (${{ matrix.optimize }})
              run: zig build check -Doptimize=${{ matrix.optimize }} --summary all

            - name: Test project (${{ matrix.optimize }})
              run: zig build test -Doptimize=${{ matrix.optimize }} --summary all

    cross-compile:
        runs-on: blacksmith-4vcpu-ubuntu-2404
        strategy:
            fail-fast: false
            matrix:
                target:
                    [
                        x86_64-windows,
                        x86_64-macos,
                        aarch64-macos,
                        aarch64-linux,
                        x86_64-linux-musl,
                    ]

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Zig
              uses: mlugg/setup-zig@v2
              with:
                  version: 0.17.0
                  cache-key: cross-${{ matrix.target }}

            - name: Compile for ${{ matrix.target }}
              run: zig build check -Dtarget=${{ matrix.target }} --summary all
